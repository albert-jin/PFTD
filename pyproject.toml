[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pftd"
version = "0.1.0"
description = "Progressive Functional Trajectory Distillation"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
train = ["torch==2.7.0", "transformers==4.51.3", "peft==0.15.2", "accelerate>=1.6,<2", "safetensors>=0.5", "numpy>=1.26", "PyYAML>=6", "openai>=1.58,<2", "sympy>=1.13.3,<1.15", "word2number", "timeout-decorator", "Pebble"]
vllm = ["vllm==0.9.1"]
[project.scripts]
pftd = "pftd.cli:main"

[tool.setuptools.packages.find]
include = ["pftd*"]
